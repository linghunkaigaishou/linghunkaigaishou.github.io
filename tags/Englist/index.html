  <script>
    (function () {
      const WORKER_URL = 'https://my-blog-ai-proxy.927793613.workers.dev/v1/chat/completions';
      const MODEL = 'glm-4-flash';
      const messages = [
        { role: 'system', content: '你是博客的看板娘，回答要简短、可爱、像朋友一样聊天。' }
      ];

      const toggle = document.getElementById('ai-waifu-toggle');
      const panel = document.getElementById('ai-waifu-panel');
      const list = document.getElementById('ai-waifu-messages');
      const input = document.getElementById('ai-waifu-input');
      const send = document.getElementById('ai-waifu-send');

      toggle.addEventListener('click', () => {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) input.focus();
      });

      function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = 'ai-msg ' + (role === 'user' ? 'user' : 'bot');
        const span = document.createElement('span');
        span.textContent = text;
        div.appendChild(span);
        list.appendChild(div);
        list.scrollTop = list.scrollHeight;
      }

      async function ask() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        addMsg('user', text);
        messages.push({ role: 'user', content: text });
        addMsg('bot', '思考中…');

        try {
          const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: MODEL,
              messages: messages.slice(-8),
            }),

            '呜…我刚刚走神了，再说一遍好不好～';
          list.lastChild.querySelector('span').textContent = reply;
          messages.push({ role: 'assistant', content: reply });
        } catch (e) {
          list.lastChild.querySelector('span').textContent =
            '呜…好像连不上我的大脑，稍后再试试吧。';
        }
      }

      send.addEventListener('click', ask);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') ask();
      });
    })();
